# ============================================================
# LikeMinds Layer 1 - Input Configuration
# ============================================================
# TEST RUN: artifacts_only mode
# Providing only the nodeflow JSON artifact — no docs, no URLs.
# Goal: verify the system can reverse-engineer a knowledge base
# that matches the reference docs in llm_docs/.
# ============================================================

# Platform name (required)
platform_name: "Exotel IVR"

# ------------------------------------------------------------
# SCOPE / REQUIREMENTS
# ------------------------------------------------------------
scope: |
  We want to automate the creation of IVR nodeflow JSON files on the Exotel platform.
  The final artifact is a JSON file that defines a complete IVR call flow using a
  node-based structure. Each node represents a step in the call (e.g., play audio,
  collect DTMF input, transfer call, run a sub-flow), and nodes are connected via
  transitions that define routing logic based on user input or conditions.
  The system should be able to generate valid nodeflow JSON files given a natural
  language description of what the IVR should do.

# ------------------------------------------------------------
# ARTIFACTS (local files)
# ------------------------------------------------------------
# Only the nodeflow JSON is provided for this test run.
artifacts_dir: "sample_artifacts"

# Files to exclude from the artifacts directory (in addition to hidden files
# like .DS_Store which are always skipped automatically).
# exclude_files:
