# LikeMinds KB Builder — Input Config
#
# HOW TO USE:
#   1. Fill in the prompt below — describe the platform, use case, and paste any doc URLs.
#   2. (Optional) Drop sample files into inputs/sample_artifacts/ and docs into inputs/docs/
#   3. Run:  /build-kb   (Claude Code)   or   python main.py   (SDK)
#
# The agent drafts a KB, identifies gaps, and loops with you until it's complete.

prompt: |
  I want to automate the integration of MoEngage analytics events into each platform they offer, i.e https://developers.moengage.com/hc/en-us.
  Refer to their website for the documentation. The agent should be able to use the moEngage sdk to integrate the analytics events into the platform.
