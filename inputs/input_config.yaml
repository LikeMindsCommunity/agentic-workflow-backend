# ============================================================
# LikeMinds Layer 1 - Input Configuration
# ============================================================
# Three fields to fill in. That's it.
#
# Artifacts:  drop files into inputs/sample_artifacts/
# Local docs: drop files into inputs/docs/
# ============================================================

# What platform is this? (required)
platform_name: "Exotel IVR"

# What are we trying to automate? Describe the artifact and its purpose. (required)
scope: |
  We want to automate the creation of IVR workflows on the Exotel platform.
  The final artifact is a JSON file that represents a complete IVR call flow.
  The system should be able to generate these JSON files given a natural
  language description of what the IVR should do.

# Online documentation URLs to read. Leave empty if using local docs only. (optional)
doc_urls:
  # - "https://developer.exotel.com/api/ivr-workflows"
  # - "https://developer.exotel.com/api/call-flows"
