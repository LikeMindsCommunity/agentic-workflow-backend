# Local dev stack: the likeminds_mcp server.
#
#   docker compose up --build -d
#
# All config/secrets come from .env (CLAUDE_TOKEN, R2_*, MONGODB_URI, MONGODB_DB_NAME,
# EMAIL_GHUPSHAP_KEY, PUBLIC_BASE_URL, …). Mongo is HOSTED (Atlas) — there is no local
# database container; MONGODB_URI just points at the cluster.
#
# NOTE: PUBLIC_BASE_URL must be an address clients can actually reach and must match the
# URL they connect to exactly (it's the OAuth issuer) — never 0.0.0.0.

services:
  mcp:
    build: .
    container_name: likeminds-mcp
    restart: unless-stopped
    env_file: .env
    ports:
      - "8787:8787"
    # Headless Chromium (used by the document skills) crashes on Docker's default 64M SHM.
    shm_size: "1g"
    volumes:
      # Persist deliverables across restarts. A named volume (not a host bind) keeps the
      # non-root container user's ownership intact. Sessions stay ephemeral by design.
      - mcp_outputs:/app/outputs

volumes:
  mcp_outputs:
